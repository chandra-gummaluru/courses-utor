<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSC258 Lectures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette and type lifted from beamer.changapp.net: warm paper background,
     cool graphite ink, EB Garamond display title, flat hairline surfaces. */
  :root {
    --bg:         oklch(0.99 0.003 80);
    --surface:    oklch(1 0 0);
    --surface-2:  oklch(0.97 0.004 80);
    --text:       oklch(0.22 0.012 260);
    --text-2:     oklch(0.38 0.01 260);
    --text-3:     oklch(0.55 0.008 260);
    --border:     oklch(0.88 0.005 260);
    --border-med: oklch(0.72 0.006 260);
    --primary:    oklch(0.45 0.005 260);
    --primary-hv: oklch(0.36 0.006 260);
    --primary-bd: oklch(0.32 0.006 260);
    --on-primary: oklch(0.99 0.003 80);
    --deco:       oklch(0.92 0.004 260);
    --shadow-lift: 0 18px 40px -18px oklch(0.22 0.012 260 / 0.18);
    --font-ui:    "Computer Modern Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-serif: "EB Garamond", "Computer Modern Serif", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:         oklch(0.19 0.006 260);
      --surface:    oklch(0.23 0.006 260);
      --surface-2:  oklch(0.26 0.006 260);
      --text:       oklch(0.95 0.004 80);
      --text-2:     oklch(0.80 0.006 260);
      --text-3:     oklch(0.65 0.008 260);
      --border:     oklch(0.32 0.006 260);
      --border-med: oklch(0.45 0.006 260);
      --primary:    oklch(0.88 0.004 80);
      --primary-hv: oklch(0.96 0.003 80);
      --primary-bd: oklch(0.96 0.003 80);
      --on-primary: oklch(0.20 0.008 260);
      --deco:       oklch(0.25 0.006 260);
      --shadow-lift: 0 18px 40px -18px oklch(0 0 0 / 0.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Background linework, echoing the faint wedges on the Beamer+ home ── */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .deco svg { width: 100%; height: 100%; }
  .deco path { fill: none; stroke: var(--deco); stroke-width: 1.2; }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 72px 16px 72px; }

  /* ── Header ── */
  header { margin-bottom: 40px; }
  h1 {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(2.6rem, 6vw, 4.16rem);
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin: 0 0 6px;
  }
  .subtitle { margin: 0; color: var(--text-2); font-size: 15.36px; font-weight: 500; letter-spacing: 0.01em; }

  .tools { margin-top: 28px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .search-wrap { position: relative; width: 100%; max-width: 320px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-3); }
  .search {
    width: 100%; height: 40px; padding: 0 14px 0 36px;
    border-radius: 8px; border: 1px solid var(--border-med);
    background: var(--surface); color: var(--text);
    font: inherit; font-size: 14px;
    transition: border-color .15s ease;
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { outline: none; border-color: var(--text-2); }

  /* ── Cards ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-med);
    border-radius: 10px;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .card:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }

  /* Card header bar: lecture label and date */
  .chrome {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .label {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-3);
  }
  .date { margin-left: auto; font-size: 12px; color: var(--text-3); }

  .body { padding: 18px 18px 18px; display: flex; flex-direction: column; flex: 1; }
  .card h2 {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 1.45rem;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin: 0 0 6px;
  }
  .card p { margin: 0 0 18px; color: var(--text-2); font-size: 14px; flex: 1; }

  /* ── Buttons: graphite primary, outlined secondary, as on the home page ── */
  .files { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--primary-bd);
    background: var(--primary); color: var(--on-primary);
    text-decoration: none; font-size: 14px; font-weight: 600;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn:hover { background: var(--primary-hv); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-med); padding: 0 14px; }
  .btn.secondary:hover { background: var(--surface-2); border-color: var(--text-3); }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .btn.disabled {
    background: transparent; color: var(--text-3); border: 1px dashed var(--border-med);
    pointer-events: none; font-weight: 500;
  }
  .btn:focus-visible, .search:focus-visible { outline: 2px solid var(--text-2); outline-offset: 2px; }


  /* ── Weeks (accordion) ── */
  .weeks { display: flex; flex-direction: column; gap: 12px; }
  .week {
    background: var(--surface);
    border: 1px solid var(--border-med);
    border-radius: 10px;
    overflow: hidden;
    transition: box-shadow .2s ease;
  }
  .week.open { box-shadow: var(--shadow-lift); }
  .week-head {
    all: unset; box-sizing: border-box;
    width: 100%; cursor: pointer;
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 18px;
    padding: 16px 20px;
    transition: background .15s ease;
  }
  .week-head:hover { background: var(--surface-2); }
  .week-head:focus-visible { outline: 2px solid var(--text-2); outline-offset: -2px; border-radius: 10px; }
  .week-name { font-family: var(--font-serif); font-weight: 500; font-size: 1.6rem; line-height: 1; letter-spacing: -0.01em; min-width: 4.6em; }
  .week-topics { color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .week-meta { text-align: right; line-height: 1.3; }
  .week-meta .label { display: block; }
  .week-meta .dates { font-size: 12px; color: var(--text-3); }
  .chev { width: 18px; height: 18px; color: var(--text-3); transition: transform .2s ease; }
  .week.open .chev { transform: rotate(180deg); }
  .week-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .week.open .week-panel { grid-template-rows: 1fr; }
  .week-panel > div { overflow: hidden; min-height: 0; }
  .week-panel .grid { padding: 4px 20px 20px; border-top: 1px solid var(--border); padding-top: 18px; }
  .week-panel .card:hover { transform: none; }
  .toggle-all {
    height: 40px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--border-med); background: var(--surface); color: var(--text);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s ease;
  }
  .toggle-all:hover { background: var(--surface-2); }
  @media (max-width: 640px) {
    .week-head { grid-template-columns: 1fr auto; row-gap: 6px; padding: 14px 16px; }
    .week-topics { grid-column: 1 / -1; grid-row: 2; white-space: normal; }
    .week-meta { display: none; }
    .week-panel .grid { padding: 16px; }
  }
  .empty { color: var(--text-3); text-align: center; padding: 48px 0; display: none; }

  @media (prefers-reduced-motion: reduce) { .card, .btn, .week-panel, .chev { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMinYMid slice">
    <path d="M90 170 L245 245 L205 800 L165 800 Z"/>
    <path d="M370 440 L480 490 L270 800 L230 800 Z"/>
    <path d="M1080 60 L1180 110 L1130 420 Z"/>
  </svg>
</div>
<div class="wrap">
  <header>
    <h1 id="course-title"></h1>
    <p class="subtitle" id="course-subtitle"></p>
    <div class="tools">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search" id="search" type="search" placeholder="Search lectures" aria-label="Search lectures">
      </div>
      <button class="toggle-all" id="toggle-all" type="button">Expand all</button>
    </div>
  </header>

  <main class="weeks" id="weeks"></main>
  <p class="empty" id="empty">No lectures match your search.</p>
</div>

<script>
/* ============================================================
   EDIT EVERYTHING BELOW THIS LINE
   ------------------------------------------------------------
   - "file" is a direct OneDrive download link. To make one from a
     share link, copy the ID (the long part starting with "IQ",
     without "?e=...") into:
     https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=ID
   - Optional: add  date: "Sep 8"  to show a date on a card.
   - Optional: add  extras: [{ label: "Notes", file: "..." }]
     for extra buttons.
   - Leave "file" empty ("") to show "Coming soon".
   - "week" decides which week a lecture is grouped under.
     Several lectures can share a week.
   - WEEKS (optional) adds a date range or note to a week's row.
   ============================================================ */

const COURSE = {
  title: "Computer Organization",
  subtitle: "CSC258 · Fall 2026 · University of Toronto"
};

const WEEKS = {
  // 1: { dates: "Sep 8 – 12" },
  // 2: { dates: "Sep 15 – 19", note: "Quiz 1" },
};

const LECTURES = [
  {
    week: 1,
    number: 0,
    title: "Prologue",
    description: "The road map for the course: from combinational logic, to sequential logic, to processor architecture.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQDLvqMKb37kQLnGPK3SdJ3dAdBiAtC3vtMNS16IM06yN-g"
  },
  {
    week: 1,
    number: 1,
    title: "Transistors and Logic Gates",
    description: "How transistors act as switches, and how they combine into the basic logic gates.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQB6EFXdO7OITZ0vJzr9UlNqAbLPYc_BZtAusdm5HsYDb_g"
  },
  {
    week: 2,
    number: 2,
    title: "Boolean Algebra",
    description: "Notation and laws for writing and simplifying expressions over binary values.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQB4iQoihQy1SadbgPUS2FFNAfnGB5VMYQFpnMvk2Cm2soU"
  },
  {
    week: 2,
    number: 3,
    title: "Combinational Circuit Design",
    description: "Circuits whose output depends only on their current input, simplified with Karnaugh maps.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQAFZE1AQpsBTJFbtQu5GVgcAReg1CjyETgM9sMKL0D_bQA"
  },
  {
    week: 3,
    number: 4,
    title: "Logical Devices",
    description: "Multiplexers, de-multiplexers, decoders and encoders, plus don't-care values.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQBFyXnDiUDmTrVV-ttbtU1kAeuXgporv7YjheScORKhubg"
  },
  {
    week: 4,
    number: 5,
    title: "Binary Arithmetic",
    description: "Unsigned binary, hexadecimal, and how signed numbers are represented.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQBis1QD9bSOTL9jwOfFhEfNAcDj6xHLph4sbU-VkWemsfc"
  },
  {
    week: 5,
    number: 6,
    title: "Arithmetic Devices",
    description: "Adders, subtractors, overflow, comparators, shifters and multipliers.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQCgQYEZZOZ7Q4X3PeM9Xp1eAZ7dskd5jwdAYio84tucEnA"
  },
  {
    week: 6,
    number: 7,
    title: "Latches and Flip-Flops",
    description: "SR and D latches, edge-triggering, and D flip-flop timing with setup and hold.",
    file: "https://utoronto-my.sharepoint.com/personal/chandra_gummaluru_mail_utoronto_ca/_layouts/15/download.aspx?share=IQBaOkmjQQzIQqfSTAV4UduZAZyvQTctxQYfMVUm_u52zyw"
  },
  {
    week: 7,
    number: 8,
    title: "Registers and Memory",
    description: "Storing multi-bit values in registers and organizing them into register files.",
    file: ""
  },
  {
    week: 8,
    number: 9,
    title: "Finite State Machines",
    description: "State diagrams, how an FSM is structured, and a step-by-step design procedure.",
    file: ""
  },
  {
    week: 9,
    number: 10,
    title: "Processor Architecture",
    description: "The datapath, control, and the instruction cycle.",
    file: ""
  },
  {
    week: 10,
    number: 11,
    title: "Assembly Language",
    description: "Instruction formats, kinds of instructions, a first program, and the whole stack.",
    file: ""
  }
];

/* ============================================================
   NO NEED TO EDIT BELOW THIS LINE
   ============================================================ */

const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function button(label, file, cls = "") {
  if (!file) return `<span class="btn disabled">Coming soon</span>`;
  const external = /^https?:\/\//.test(file);
  const attrs = external ? 'target="_blank" rel="noopener"' : "download";
  return `<a class="btn ${cls}" href="${esc(external ? file : encodeURI(file))}" ${attrs}>${ICON}${esc(label)}</a>`;
}

document.getElementById("course-title").textContent = COURSE.title;
document.getElementById("course-subtitle").textContent = COURSE.subtitle;
document.title = COURSE.title + " · Lectures";

const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

function card(l, i) {
  const num = String(l.number ?? i + 1).padStart(2, "0");
  return `
  <article class="card" data-search="${esc((l.title + " " + l.description + " lecture " + num + " " + Number(num) + " week " + l.week).toLowerCase())}">
    <div class="chrome">
      <span class="label">Lecture ${num}</span>
      ${l.date ? `<span class="date">${esc(l.date)}</span>` : ""}
    </div>
    <div class="body">
      <h2>${esc(l.title)}</h2>
      <p>${esc(l.description)}</p>
      <div class="files">
        ${button("Download", l.file)}
        ${(l.extras || []).map(x => button(x.label, x.file, "secondary")).join("")}
      </div>
    </div>
  </article>`;
}

// Group lectures by week, keeping weeks in numeric order.
const groups = new Map();
LECTURES.forEach((l, i) => {
  const w = l.week ?? 0;
  if (!groups.has(w)) groups.set(w, []);
  groups.get(w).push({ l, i });
});
const weekNums = [...groups.keys()].sort((a, b) => a - b);

const weeksEl = document.getElementById("weeks");
weeksEl.innerHTML = weekNums.map(w => {
  const items = groups.get(w);
  const info  = WEEKS[w] || {};
  const n     = items.length;
  return `
  <section class="week" data-week="${w}">
    <button class="week-head" type="button" aria-expanded="false" aria-controls="week-${w}">
      <span class="week-name">Week ${w}</span>
      <span class="week-topics">${esc(items.map(x => x.l.title).join(" · "))}</span>
      <span class="week-meta">
        <span class="label">${n} lecture${n === 1 ? "" : "s"}${info.note ? " · " + esc(info.note) : ""}</span>
        ${info.dates ? `<span class="dates">${esc(info.dates)}</span>` : ""}
      </span>
      ${CHEV}
    </button>
    <div class="week-panel" id="week-${w}" role="region">
      <div><div class="grid">${items.map(x => card(x.l, x.i)).join("")}</div></div>
    </div>
  </section>`;
}).join("");

const weekEls  = [...weeksEl.querySelectorAll(".week")];
const toggleAll = document.getElementById("toggle-all");

function setOpen(sec, open) {
  sec.classList.toggle("open", open);
  sec.querySelector(".week-head").setAttribute("aria-expanded", String(open));
  // Collapsed cards stay out of the tab order.
  sec.querySelector(".week-panel").inert = !open;
}
function syncToggleAll() {
  const visible = weekEls.filter(s => s.style.display !== "none");
  toggleAll.textContent = visible.length && visible.every(s => s.classList.contains("open")) ? "Collapse all" : "Expand all";
}

weekEls.forEach(sec => {
  setOpen(sec, false);
  sec.querySelector(".week-head").addEventListener("click", () => {
    setOpen(sec, !sec.classList.contains("open"));
    syncToggleAll();
  });
});

toggleAll.addEventListener("click", () => {
  const open = toggleAll.textContent === "Expand all";
  weekEls.forEach(s => { if (s.style.display !== "none") setOpen(s, open); });
  syncToggleAll();
});

// Searching opens every week that has a match and hides the rest;
// clearing the search folds everything back up.
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  weekEls.forEach(sec => {
    let hits = 0;
    sec.querySelectorAll(".card").forEach(c => {
      const m = !q || c.dataset.search.includes(q);
      c.style.display = m ? "" : "none";
      if (m) hits++;
    });
    sec.style.display = hits ? "" : "none";
    setOpen(sec, !!q && hits > 0);
    shown += hits;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
  syncToggleAll();
});

// OneDrive refuses to load inside a frame (Canvas embed, previews), so when
// this page is framed, links are pushed out to a new tab, or failing that
// the whole window, instead of navigating inside the frame.
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (_) { return true; } })();
document.addEventListener("click", e => {
  const a = e.target.closest('a.btn[href^="http"]');
  if (!a || !IN_FRAME) return;
  e.preventDefault();
  const w = window.open(a.href, "_blank", "noopener");
  if (w === null) {
    try { window.top.location.href = a.href; } catch (_) { location.href = a.href; }
  }
});
</script>
</body>
</html>
